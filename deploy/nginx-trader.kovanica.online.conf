# trader.kovanica.online — Phase A
# Place in /etc/nginx/sites-available/ and symlink to sites-enabled
# DNS A record → VPS IP (Cloudflare proxy optional)

upstream trader_api {
    server 127.0.0.1:8000;
}

upstream trader_ui_dev {
    server 127.0.0.1:5173;
}

server {
    listen 80;
    server_name trader.kovanica.online;

    # After certbot, this redirects to HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /api/ {
        proxy_pass http://trader_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://trader_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Dev UI via Vite (Phase A). Later: root /var/www/trader; try_files $uri /index.html;
    location / {
        proxy_pass http://trader_ui_dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

