version: "3.9"

services:
  bot:
    build: .
    container_name: trading-bot
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config:ro
    restart: unless-stopped
    networks:
      - botnet
    depends_on:
      - dashboard

  dashboard:
    build: .
    container_name: trading-dashboard
    command: uvicorn dashboard.backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    restart: unless-stopped
    networks:
      - botnet

  # Optional: frontend can be served by nginx or run separately in dev
  # frontend:
  #   image: node:20-alpine
  #   working_dir: /app
  #   volumes:
  #     - ./dashboard/frontend:/app
  #   command: sh -c "npm install && npm run dev -- --host"
  #   ports:
  #     - "5173:5173"
  #   networks:
  #     - botnet

networks:
  botnet:
    driver: bridge
